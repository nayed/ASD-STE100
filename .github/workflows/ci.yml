# Checks every pull request and every push to main.
# Cloudflare Pages deploys main separately (build settings in its dashboard).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # diagrams: fail on labels that collide or get cut off (scripts/check-figures.ts)
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run check:figures
